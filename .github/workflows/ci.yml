name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies (CPU-only torch, no Spark/Kafka)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy pyarrow joblib matplotlib pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Run tests
        run: python -m pytest tests/ -v
